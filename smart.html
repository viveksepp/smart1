<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Integrated Management System with Authentication & RBAC</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React, ReactDOM, Babel for single-file browser runtime -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- Inline SVG Icon Component (Full-size SVGs inside sized wrapper) ---
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const icons = {
        layers: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
        'shield-check': <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,
        lock: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
        'alert-circle': <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
        mail: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
        key: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
        'arrow-right': <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>,
        activity: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
        users: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
        'user-check': <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>,
        'book-open': <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
        box: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
        calendar: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
        bookmark: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>,
        'log-out': <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
        search: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>,
        plus: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
        edit: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
        trash: <svg className="w-full h-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      };

      return (
        <span className={`inline-flex items-center justify-center flex-shrink-0 ${className}`} {...props}>
          {icons[name] || null}
        </span>
      );
    };

    // --- DEMO ACCOUNTS & RBAC PERMISSIONS ---
    const DEMO_ACCOUNTS = [
      {
        email: 'admin@campus.edu',
        password: 'admin123password',
        name: 'Dr. Sarah Connor',
        role: 'Admin',
        department: 'Central Administration',
        avatarColor: 'bg-indigo-600',
        badgeColor: 'bg-indigo-100 text-indigo-700 border-indigo-300'
      },
      {
        email: 'faculty@campus.edu',
        password: 'faculty123password',
        name: 'Dr. Robert Smith',
        role: 'Faculty',
        department: 'Computer Science',
        avatarColor: 'bg-rose-600',
        badgeColor: 'bg-rose-100 text-rose-700 border-rose-300'
      },
      {
        email: 'staff@campus.edu',
        password: 'staff123password',
        name: 'Michael Miller',
        role: 'Staff',
        department: 'Campus Operations',
        avatarColor: 'bg-emerald-600',
        badgeColor: 'bg-emerald-100 text-emerald-700 border-emerald-300'
      },
      {
        email: 'student@campus.edu',
        password: 'student123password',
        name: 'Alex Johnson',
        role: 'Student',
        department: 'Computer Science',
        avatarColor: 'bg-blue-600',
        badgeColor: 'bg-blue-100 text-blue-700 border-blue-300'
      }
    ];

    const ROLE_PERMISSIONS = {
      Admin: {
        canManageStudents: true,
        canManageFaculty: true,
        canManageCourses: true,
        canManageResources: true,
        canManageActivities: true,
        description: 'Superuser - Full CRUD access across all campus modules'
      },
      Faculty: {
        canManageStudents: false,
        canManageFaculty: false,
        canManageCourses: true,
        canManageResources: false,
        canManageActivities: true,
        description: 'Academic User - Manage courses & events, view directories'
      },
      Staff: {
        canManageStudents: true,
        canManageFaculty: true,
        canManageCourses: false,
        canManageResources: true,
        canManageActivities: true,
        description: 'Operations Staff - Register students/faculty & manage facilities'
      },
      Student: {
        canManageStudents: false,
        canManageFaculty: false,
        canManageCourses: false,
        canManageResources: false,
        canManageActivities: false,
        description: 'Enrolled Student - Read-only access & resource booking requests'
      }
    };

    const initialStudents = [
      { id: 'STU001', name: 'Alex Johnson', email: 'alex.j@campus.edu', password: 'student123password', phone: '+91 98765 43210', department: 'Computer Science', year: '3rd Year', status: 'Active' },
      { id: 'STU002', name: 'Sophia Chen', email: 'sophia.c@campus.edu', password: 'sophia123password', phone: '+91 98234 56789', department: 'Electrical Eng.', year: '2nd Year', status: 'Active' },
      { id: 'STU003', name: 'Marcus Vance', email: 'm.vance@campus.edu', password: 'marcus123password', phone: '+91 91234 87654', department: 'Mechanical Eng.', year: '4th Year', status: 'On Leave' },
      { id: 'STU004', name: 'Emily Davis', email: 'e.davis@campus.edu', password: 'emily123password', phone: '+91 99887 76655', department: 'Biotechnology', year: '1st Year', status: 'Active' }
    ];

    const initialFaculty = [
      { id: 'FAC101', name: 'Dr. Robert Smith', email: 'r.smith@campus.edu', password: 'faculty123password', phone: '+91 94480 11223', department: 'Computer Science', designation: 'Professor', courseCoordinator: 'CS301 - Data Structures & Algorithms' },
      { id: 'FAC102', name: 'Prof. Elena Rostova', email: 'e.rostova@campus.edu', password: 'elena123password', phone: '+91 94480 44556', department: 'Electrical Eng.', designation: 'Associate Professor', courseCoordinator: 'EE204 - Microcontrollers & IoT' },
      { id: 'FAC103', name: 'Dr. Michael Chang', email: 'm.chang@campus.edu', password: 'michael123password', phone: '+91 94480 77889', department: 'Biotechnology', designation: 'Assistant Professor', courseCoordinator: 'BIO102 - Intro to Computational Biology' }
    ];

    const initialCourses = [
      { id: 'CS301', title: 'Data Structures & Algorithms', faculty: 'Dr. Robert Smith', credits: 4, enrolled: 45, status: 'Active' },
      { id: 'EE204', title: 'Microcontrollers & IoT', faculty: 'Prof. Elena Rostova', credits: 3, enrolled: 38, status: 'Active' },
      { id: 'BIO102', title: 'Intro to Computational Biology', faculty: 'Dr. Michael Chang', credits: 4, enrolled: 29, status: 'Upcoming' }
    ];

    const initialResources = [
      { id: 'RES-01', name: 'Main Auditorium (Room 101)', category: 'Classrooms', capacity: 250, status: 'Available', specs: 'Projector, Dolby Audio' },
      { id: 'RES-02', name: 'Advanced Robotics Lab', category: 'Laboratories', capacity: 30, status: 'Occupied', specs: '3D Printers, Robotic Arms' },
      { id: 'RES-03', name: 'High-Performance GPU Cluster', category: 'Equipment', capacity: 8, status: 'Available', specs: '4x NVIDIA A100 Nodes' },
      { id: 'RES-04', name: 'Physics Optics Lab 2B', category: 'Laboratories', capacity: 25, status: 'Maintenance', specs: 'Laser Test Benches' }
    ];

    const initialActivities = [
      { id: 'ACT-01', name: 'Annual Hackathon 2026', date: '2026-11-25', time: '09:00 AM', venue: 'Main Auditorium', organizer: 'CS Club', status: 'Confirmed' },
      { id: 'ACT-02', name: 'Guest Lecture: Quantum Computing', date: '2026-11-28', time: '02:00 PM', venue: 'Hall B', organizer: 'Physics Dept', status: 'Upcoming' },
      { id: 'ACT-03', name: 'Inter-Department Robotics Cup', date: '2026-12-04', time: '10:00 AM', venue: 'Robotics Lab', organizer: 'Robotics Club', status: 'Planning' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Core Data Collections
      const [students, setStudents] = useState(initialStudents);
      const [faculty, setFaculty] = useState(initialFaculty);
      const [courses, setCourses] = useState(initialCourses);
      const [resources, setResources] = useState(initialResources);
      const [activities, setActivities] = useState(initialActivities);

      const [searchQuery, setSearchQuery] = useState('');
      const [modalType, setModalType] = useState(null); 
      
      const [bookingDetails, setBookingDetails] = useState({ resourceId: 'RES-01', user: '', date: '', timeSlot: '09:00 AM - 11:00 AM' });
      const [bookingStatusMsg, setBookingStatusMsg] = useState(null);

      // Form Models
      const [newStudent, setNewStudent] = useState({ name: '', email: '', password: '', phone: '', department: 'Computer Science', year: '1st Year', status: 'Active' });
      const [editingStudent, setEditingStudent] = useState(null);

      const [newFaculty, setNewFaculty] = useState({ name: '', email: '', password: '', phone: '', department: 'Computer Science', designation: 'Assistant Professor', courseCoordinator: '' });
      const [editingFaculty, setEditingFaculty] = useState(null);

      const [newCourse, setNewCourse] = useState({ id: '', title: '', faculty: 'Dr. Robert Smith', credits: 4, enrolled: 0, status: 'Active' });
      const [editingCourse, setEditingCourse] = useState(null);

      const [newResource, setNewResource] = useState({ name: '', category: 'Classrooms', capacity: 50, status: 'Available', specs: '' });
      const [editingResource, setEditingResource] = useState(null);

      const [newActivity, setNewActivity] = useState({ name: '', date: '', time: '10:00 AM', venue: 'Main Auditorium', organizer: '', status: 'Confirmed' });
      const [editingActivity, setEditingActivity] = useState(null);

      const permissions = useMemo(() => {
        if (!currentUser) return null;
        return ROLE_PERMISSIONS[currentUser.role] || ROLE_PERMISSIONS['Student'];
      }, [currentUser]);

      // Build loginable Student & Faculty accounts registered by Admin/Staff
      const allLoginAccounts = useMemo(() => {
        const studentLogins = students.map(s => ({
          email: s.email,
          password: s.password || 'student123password',
          name: s.name,
          role: 'Student',
          department: s.department,
          avatarColor: 'bg-blue-600',
          badgeColor: 'bg-blue-100 text-blue-700 border-blue-300'
        }));

        const facultyLogins = faculty.map(f => ({
          email: f.email,
          password: f.password || 'faculty123password',
          name: f.name,
          role: 'Faculty',
          department: f.department,
          avatarColor: 'bg-rose-600',
          badgeColor: 'bg-rose-100 text-rose-700 border-rose-300'
        }));

        return [...DEMO_ACCOUNTS, ...studentLogins, ...facultyLogins];
      }, [students, faculty]);

      const loginAsUser = (userAccount) => {
        setAuthError('');
        setBookingDetails(prev => ({ ...prev, user: userAccount.name }));
        setCurrentUser(userAccount);
        setActiveTab('dashboard');
        setLoginEmail('');
        setLoginPassword('');
      };

      // Authentication Handler (supports Name or Email + Password)
      const handleLogin = (e) => {
        e?.preventDefault();
        setAuthError('');
        const identifier = loginEmail.trim().toLowerCase();

        if (!identifier) {
          setAuthError('Please enter your registered Name or Email address.');
          return;
        }
        if (!loginPassword) {
          setAuthError('Please enter your security password.');
          return;
        }

        const matchedAccount = allLoginAccounts.find(
          a => a.email.toLowerCase() === identifier || a.name.toLowerCase() === identifier
        );

        if (!matchedAccount) {
          setAuthError('Account not found. Only Admin and Staff can register Student or Faculty accounts.');
          return;
        }

        if (matchedAccount.password !== loginPassword) {
          setAuthError('Incorrect password. Please check the password assigned by Admin or Staff.');
          return;
        }

        loginAsUser(matchedAccount);
      };

      const handleQuickLogin = (demoAcc) => {
        loginAsUser(demoAcc);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setActiveTab('dashboard');
        setSearchQuery('');
      };

      // --- STUDENT CRUD (Admin & Staff Only) ---
      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!permissions?.canManageStudents) return;
        const cleanName = newStudent.name.trim();
        if (!cleanName || !newStudent.password.trim()) return;
        const slug = cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '');
        const cleanEmail = newStudent.email.trim() || `${slug || 'student'}@campus.edu`;
        const nextNum = students.length > 0 ? Math.max(...students.map(s => parseInt(s.id.replace('STU', ''), 10) || 0)) + 1 : 1;
        const created = {
          ...newStudent,
          name: cleanName,
          email: cleanEmail,
          password: newStudent.password.trim(),
          id: `STU${String(nextNum).padStart(3, '0')}`
        };
        setStudents([...students, created]);
        setModalType(null);
        setNewStudent({ name: '', email: '', password: '', phone: '', department: 'Computer Science', year: '1st Year', status: 'Active' });
      };

      const handleUpdateStudent = (e) => {
        e.preventDefault();
        if (!permissions?.canManageStudents) return;
        setStudents(students.map(s => (s.id === editingStudent.id ? editingStudent : s)));
        setModalType(null);
        setEditingStudent(null);
      };

      const handleDeleteStudent = (id) => {
        if (!permissions?.canManageStudents) return;
        setStudents(students.filter(s => s.id !== id));
      };

      // --- FACULTY CRUD (Admin & Staff Only) ---
      const handleAddFaculty = (e) => {
        e.preventDefault();
        if (!permissions?.canManageFaculty) return;
        const cleanName = newFaculty.name.trim();
        if (!cleanName || !newFaculty.password.trim()) return;
        const slug = cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '');
        const cleanEmail = newFaculty.email.trim() || `${slug || 'faculty'}@campus.edu`;
        const nextNum = faculty.length > 0 ? Math.max(...faculty.map(f => parseInt(f.id.replace('FAC', ''), 10) || 100)) + 1 : 101;
        const created = {
          ...newFaculty,
          name: cleanName,
          email: cleanEmail,
          password: newFaculty.password.trim(),
          id: `FAC${nextNum}`
        };
        setFaculty([...faculty, created]);
        setModalType(null);
        setNewFaculty({ name: '', email: '', password: '', phone: '', department: 'Computer Science', designation: 'Assistant Professor', courseCoordinator: '' });
      };

      const handleUpdateFaculty = (e) => {
        e.preventDefault();
        if (!permissions?.canManageFaculty) return;
        setFaculty(faculty.map(f => (f.id === editingFaculty.id ? editingFaculty : f)));
        setModalType(null);
        setEditingFaculty(null);
      };

      const handleDeleteFaculty = (id) => {
        if (!permissions?.canManageFaculty) return;
        setFaculty(faculty.filter(f => f.id !== id));
      };

      // --- COURSE CRUD ---
      const handleAddCourse = (e) => {
        e.preventDefault();
        const formattedCode = newCourse.id.trim().toUpperCase() || `CRS${courses.length + 101}`;
        const created = { ...newCourse, id: formattedCode, credits: Number(newCourse.credits), enrolled: Number(newCourse.enrolled) };
        setCourses([...courses, created]);
        setModalType(null);
        setNewCourse({ id: '', title: '', faculty: faculty[0]?.name || 'Dr. Robert Smith', credits: 4, enrolled: 0, status: 'Active' });
      };

      const handleUpdateCourse = (e) => {
        e.preventDefault();
        setCourses(courses.map(c => (c.id === editingCourse.id ? { ...editingCourse, credits: Number(editingCourse.credits), enrolled: Number(editingCourse.enrolled) } : c)));
        setModalType(null);
        setEditingCourse(null);
      };

      const handleDeleteCourse = (id) => {
        setCourses(courses.filter(c => c.id !== id));
      };

      // --- RESOURCE CRUD ---
      const handleAddResource = (e) => {
        e.preventDefault();
        const nextNum = resources.length > 0 ? Math.max(...resources.map(r => parseInt(r.id.replace('RES-', ''), 10) || 0)) + 1 : 1;
        const created = { ...newResource, id: `RES-${String(nextNum).padStart(2, '0')}`, capacity: Number(newResource.capacity) };
        setResources([...resources, created]);
        setModalType(null);
        setNewResource({ name: '', category: 'Classrooms', capacity: 50, status: 'Available', specs: '' });
      };

      const handleUpdateResource = (e) => {
        e.preventDefault();
        setResources(resources.map(r => (r.id === editingResource.id ? { ...editingResource, capacity: Number(editingResource.capacity) } : r)));
        setModalType(null);
        setEditingResource(null);
      };

      const handleDeleteResource = (id) => {
        setResources(resources.filter(r => r.id !== id));
      };

      // --- ACTIVITY CRUD ---
      const handleAddActivity = (e) => {
        e.preventDefault();
        const nextNum = activities.length > 0 ? Math.max(...activities.map(a => parseInt(a.id.replace('ACT-', ''), 10) || 0)) + 1 : 1;
        const created = { ...newActivity, id: `ACT-${String(nextNum).padStart(2, '0')}` };
        setActivities([...activities, created]);
        setModalType(null);
        setNewActivity({ name: '', date: '', time: '10:00 AM', venue: 'Main Auditorium', organizer: '', status: 'Confirmed' });
      };

      const handleUpdateActivity = (e) => {
        e.preventDefault();
        setActivities(activities.map(a => (a.id === editingActivity.id ? editingActivity : a)));
        setModalType(null);
        setEditingActivity(null);
      };

      const handleDeleteActivity = (id) => {
        setActivities(activities.filter(a => a.id !== id));
      };

      // Filtered Lists
      const filteredStudents = useMemo(() => students.filter(s =>
        s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.department.toLowerCase().includes(searchQuery.toLowerCase()) ||
        (s.phone && s.phone.toLowerCase().includes(searchQuery.toLowerCase()))
      ), [students, searchQuery]);

      const filteredFaculty = useMemo(() => faculty.filter(f =>
        f.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        f.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        f.department.toLowerCase().includes(searchQuery.toLowerCase()) ||
        (f.courseCoordinator && f.courseCoordinator.toLowerCase().includes(searchQuery.toLowerCase()))
      ), [faculty, searchQuery]);

      const filteredCourses = useMemo(() => courses.filter(c =>
        c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        c.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        c.faculty.toLowerCase().includes(searchQuery.toLowerCase())
      ), [courses, searchQuery]);

      const filteredResources = useMemo(() => resources.filter(r =>
        r.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        r.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        r.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
        r.status.toLowerCase().includes(searchQuery.toLowerCase())
      ), [resources, searchQuery]);

      const filteredActivities = useMemo(() => activities.filter(a =>
        a.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        a.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        a.venue.toLowerCase().includes(searchQuery.toLowerCase()) ||
        a.organizer.toLowerCase().includes(searchQuery.toLowerCase())
      ), [activities, searchQuery]);

      // Booking Logic
      const handleSimulateBooking = (e) => {
        e.preventDefault();
        const targetRes = resources.find(r => r.id === bookingDetails.resourceId);
        if (!targetRes) return;

        if (targetRes.status === 'Occupied' || targetRes.status === 'Maintenance') {
          setBookingStatusMsg({ 
            type: 'error', 
            text: `Booking Declined: ${targetRes.name} is currently marked as ${targetRes.status}. System conflict logic prevented collision.` 
          });
        } else {
          setResources(resources.map(r => r.id === targetRes.id ? { ...r, status: 'Occupied' } : r));
          setBookingStatusMsg({ 
            type: 'success', 
            text: `Reservation Confirmed! Slot booked for ${bookingDetails.user || currentUser.name} (${currentUser.role}).` 
          });
          setTimeout(() => {
            setBookingStatusMsg(null);
          }, 4000);
        }
      };

      // --- LOGIN SCREEN ---
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div className="w-full max-w-4xl bg-slate-800 border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 z-10 animate-fade-in">
              <div className="md:col-span-5 bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950 p-8 text-white flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-700/80">
                <div>
                  <div className="flex items-center space-x-3 mb-6">
                    <div className="p-3 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-600/40">
                      <Icon name="layers" className="w-7 h-7" />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight text-white">SmartCampus</h1>
                      <p className="text-xs text-indigo-300 font-medium">Authentication Gateway</p>
                    </div>
                  </div>

                  <p className="text-xs text-slate-300 leading-relaxed mb-6">
                    Enterprise Integrated Campus Platform featuring modular Role-Based Access Control (RBAC), multi-tier security, and real-time resource validation engine.
                  </p>

                  <div className="space-y-2.5">
                    <div className="flex items-center space-x-2.5 text-xs text-slate-300">
                      <Icon name="shield-check" className="w-4 h-4 text-emerald-400" />
                      <span>Admin & Staff controlled user provisioning</span>
                    </div>
                    <div className="flex items-center space-x-2.5 text-xs text-slate-300">
                      <Icon name="lock" className="w-4 h-4 text-indigo-400" />
                      <span>Password-authenticated Student & Faculty login</span>
                    </div>
                  </div>
                </div>

                <div className="mt-8 pt-4 border-t border-slate-800 text-[11px] text-slate-400">
                  Note: Only <strong>Admin</strong> and <strong>Staff</strong> can register Student & Faculty accounts and assign their login passwords.
                </div>
              </div>

              <div className="md:col-span-7 p-8 bg-slate-800 flex flex-col justify-between space-y-6">
                <div>
                  <div className="mb-6">
                    <h2 className="text-xl font-bold text-white">Account Sign In</h2>
                    <p className="text-xs text-slate-400 mt-1">
                      Enter your registered Name or Email and Password assigned by Admin or Staff.
                    </p>
                  </div>

                  {authError && (
                    <div className="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium flex items-center gap-2">
                      <Icon name="alert-circle" className="w-4 h-4 text-rose-400 flex-shrink-0" />
                      <span>{authError}</span>
                    </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Registered Name or Email Address</label>
                      <div className="relative">
                        <Icon name="mail" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input
                          type="text"
                          placeholder="e.g. Alex Johnson or admin@campus.edu"
                          value={loginEmail}
                          onChange={(e) => setLoginEmail(e.target.value)}
                          className="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Security Password</label>
                      <div className="relative">
                        <Icon name="key" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input
                          type="password"
                          placeholder="Enter assigned password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          className="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg transition-all shadow-lg shadow-indigo-600/30"
                    >
                      Sign In to System Portal
                    </button>
                  </form>
                </div>

                <div className="pt-4 border-t border-slate-700/60">
                  <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2.5">
                    Quick Demo Role Select (One-Click)
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    {DEMO_ACCOUNTS.map((acc) => (
                      <button
                        type="button"
                        key={acc.role}
                        onClick={() => handleQuickLogin(acc)}
                        className="p-2.5 bg-slate-900/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-left transition-all group flex items-center justify-between"
                      >
                        <div className="min-w-0">
                          <div className="flex items-center space-x-1.5">
                            <span className={`w-2 h-2 rounded-full ${acc.avatarColor}`}></span>
                            <p className="text-xs font-bold text-white group-hover:text-indigo-300 transition-colors">{acc.role}</p>
                          </div>
                          <p className="text-[10px] text-slate-400 truncate mt-0.5">{acc.email}</p>
                        </div>
                        <Icon name="arrow-right" className="w-3.5 h-3.5 text-slate-500 group-hover:text-white transition-colors" />
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col md:flex-row">
          {/* SIDEBAR */}
          <aside className="w-full md:w-72 bg-slate-900 text-slate-100 flex-shrink-0 flex flex-col justify-between border-r border-slate-800">
            <div>
              <div className="p-6 border-b border-slate-800 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                    <Icon name="layers" className="w-6 h-6" />
                  </div>
                  <div>
                    <h1 className="font-bold text-lg leading-tight text-white">SmartCampus</h1>
                    <p className="text-xs text-slate-400 font-medium">Management System</p>
                  </div>

                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${currentUser.badgeColor}`}>
                    {currentUser.role}
                  </span>
                </div>
                <p className="text-xs text-white font-bold truncate">{currentUser.name}</p>
                <p className="text-[11px] text-slate-400 truncate">{currentUser.department}</p>
              </div>

              <nav className="px-3 space-y-1">
                <div className="px-3 pb-2 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Core Modules</div>
                <button 
                  type="button"
                  onClick={() => setActiveTab('dashboard')} 
                  className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'dashboard' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <Icon name="activity" className="w-4 h-4" />
                  <span>Dashboard Overview</span>
                </button>
                <button 
                  type="button"
                  onClick={() => setActiveTab('students')} 
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'students' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="users" className="w-4 h-4 text-blue-400" />
                    <span>Student Management</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{students.length}</span>
                </button>
                <button 
                  type="button"
                  onClick={() => setActiveTab('faculty')} 
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'faculty' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="user-check" className="w-4 h-4 text-rose-400" />
                    <span>Faculty Management</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{faculty.length}</span>
                </button>
                <button 
                  type="button"
                  onClick={() => setActiveTab('courses')} 
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'courses' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="book-open" className="w-4 h-4 text-amber-400" />
                    <span>Course Curriculum</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{courses.length}</span>
                </button>
                <button 
                  type="button"
                  onClick={() => setActiveTab('resources')} 
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'resources' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="box" className="w-4 h-4 text-emerald-400" />
                    <span>Facilities & Resources</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{resources.length}</span>
                </button>
                <button 
                  type="button"
                  onClick={() => setActiveTab('activities')} 
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'activities' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <Icon name="calendar" className="w-4 h-4 text-purple-400" />
                    <span>Campus Events</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{activities.length}</span>
                </button>
                <button 
                  type="button"
                  onClick={() => setActiveTab('bookings')} 
                  className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeTab === 'bookings' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800'
                  }`}
                >
                  <Icon name="bookmark" className="w-4 h-4 text-indigo-400" />
                  <span>Resource Bookings</span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800">
              <button
                type="button"
                onClick={handleLogout}
                className="w-full flex items-center justify-center space-x-2 px-3 py-2 bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-300 rounded-lg text-xs font-semibold transition-colors"
              >
                <Icon name="log-out" className="w-4 h-4" />
                <span>Sign Out ({currentUser.role})</span>
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 flex flex-col min-w-0">
            {/* TOP HEADER */}
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <h2 className="text-base font-bold text-slate-800 capitalize">
                  {activeTab === 'dashboard' ? 'System Dashboard & Operations' : `${activeTab.replace('-', ' ')} Directory`}
                </h2>
                <p className="text-xs text-slate-500">
                  {activeTab === 'dashboard' ? `Welcome back, ${currentUser.name}. Here is your live campus overview.` : `Manage, search, and update campus ${activeTab} records.`}
                </p>
              </div>

              <div className="flex items-center space-x-3 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-64">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Search records..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>
            </header>

            {/* TAB PANELS */}
            <div className="p-6 overflow-y-auto flex-1 space-y-6">
              
              {/* --- DASHBOARD OVERVIEW --- */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6 animate-fade-in">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <button
                      type="button"
                      onClick={() => setActiveTab('students')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-blue-300 shadow-sm flex items-center justify-between text-left transition-all cursor-pointer group"
                    >
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-blue-600 transition-colors">Total Students</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{students.length}</p>
                        <span className="text-[10px] text-emerald-600 font-semibold mt-1 inline-block">Active enrollment →</span>
                      </div>
                      <div className="p-3 bg-blue-50 text-blue-600 rounded-xl group-hover:bg-blue-100 transition-colors">
                        <Icon name="users" className="w-6 h-6" />
                      </div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setActiveTab('faculty')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-rose-300 shadow-sm flex items-center justify-between text-left transition-all cursor-pointer group"
                    >
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-rose-600 transition-colors">Faculty Members</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{faculty.length}</p>
                        <span className="text-[10px] text-rose-600 font-semibold mt-1 inline-block">Departments active →</span>
                      </div>
                      <div className="p-3 bg-rose-50 text-rose-600 rounded-xl group-hover:bg-rose-100 transition-colors">
                        <Icon name="user-check" className="w-6 h-6" />
                      </div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setActiveTab('courses')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-amber-300 shadow-sm flex items-center justify-between text-left transition-all cursor-pointer group"
                    >
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-amber-600 transition-colors">Active Courses</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{courses.length}</p>
                        <span className="text-[10px] text-amber-600 font-semibold mt-1 inline-block">Curriculum catalog →</span>
                      </div>
                      <div className="p-3 bg-amber-50 text-amber-600 rounded-xl group-hover:bg-amber-100 transition-colors">
                        <Icon name="book-open" className="w-6 h-6" />
                      </div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setActiveTab('resources')}
                      className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-emerald-300 shadow-sm flex items-center justify-between text-left transition-all cursor-pointer group"
                    >
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-emerald-600 transition-colors">Campus Resources</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{resources.length}</p>
                        <span className="text-[10px] text-emerald-600 font-semibold mt-1 inline-block">Labs & Auditorium →</span>
                      </div>
                      <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl group-hover:bg-emerald-100 transition-colors">
                        <Icon name="box" className="w-6 h-6" />
                      </div>
                    </button>
                  </div>

                  {/* Recent Activities & System Status */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="text-sm font-bold text-slate-800">Upcoming Campus Events & Activities</h3>
                        <button type="button" onClick={() => setActiveTab('activities')} className="text-xs font-semibold text-indigo-600 hover:underline">View All</button>
                      </div>
                      <div className="space-y-3">
                        {activities.map(act => (
                          <div key={act.id} className="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                              <div className="p-2 bg-indigo-100 text-indigo-700 rounded-lg">
                                <Icon name="calendar" className="w-4 h-4" />
                              </div>
                              <div>
                                <span className="text-xs font-bold text-slate-800">{act.name}</span>
                                <p className="text-[11px] text-slate-500 mt-0.5">{act.date} at {act.time} • Venue: {act.venue}</p>
                              </div>
                            </div>
                            <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">{act.status}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-slate-800 mb-3">System Security & RBAC</h3>
                        <p className="text-xs text-slate-500 leading-relaxed mb-4">
                          Your current role is <strong className="text-slate-800">{currentUser.role}</strong>. {permissions.description}.
                        </p>
                        <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-500">Environment</span>
                            <span className="font-semibold text-slate-700">Production v2.6</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-500">Database Status</span>
                            <span className="font-semibold text-emerald-600">Connected</span>
                          </div>
                        </div>
                      </div>
                      <div className="mt-4 pt-4 border-t border-slate-100">
                        <button type="button" onClick={() => setActiveTab('bookings')} className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition-all shadow-md shadow-indigo-600/30">
                          Book a Facility Now
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* --- STUDENTS TAB --- */}
              {activeTab === 'students' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-sm font-bold text-slate-800">Student Directory ({filteredStudents.length})</h3>
                      <p className="text-xs text-slate-500">Only Admin and Staff can register students and assign login passwords.</p>
                    </div>
                    {permissions.canManageStudents && (
                      <button type="button" onClick={() => setModalType('addStudent')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-2 shadow-md shadow-indigo-600/30 transition-all">
                        <Icon name="plus" className="w-4 h-4" />
                        <span>Register New Student</span>
                      </button>
                    )}
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-4">Name / ID</th>
                          <th className="p-4">Email Address</th>
                          {permissions.canManageStudents && <th className="p-4">Login Password</th>}
                          <th className="p-4">Phone</th>
                          <th className="p-4">Department</th>
                          <th className="p-4">Year</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {filteredStudents.map(s => (
                          <tr key={s.id} className="hover:bg-slate-50/80 transition-colors">

                              <td className="p-4 font-mono text-[11px] text-indigo-700 bg-indigo-50/40">{s.password}</td>

                            <td className="p-4 text-slate-600">{s.phone}</td>
                            <td className="p-4 text-slate-600">{s.department}</td>
                            <td className="p-4 text-slate-600">{s.year}</td>
                            <td className="p-4">
                              <span className={`px-2 py-0.5 rounded font-semibold text-[10px] border ${
                                s.status === 'Active' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                              }`}>{s.status}</span>
                            </td>
                            <td className="p-4 text-right space-x-2">
                              {permissions.canManageStudents ? (
                                <>
                                  <button type="button" onClick={() => { setEditingStudent(s); setModalType('editStudent'); }} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="edit" className="w-3.5 h-3.5" />
                                    <span>Edit</span>
                                  </button>
                                  <button type="button" onClick={() => handleDeleteStudent(s.id)} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                    <span>Delete</span>
                                  </button>
                                </>
                              ) : (
                                <span className="text-slate-400 text-[11px] italic">View Only</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- FACULTY TAB --- */}
              {activeTab === 'faculty' && (
                <div className="space-y-4 animate-fade-in">
