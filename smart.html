                    <div>
                      <h3 className="text-sm font-bold text-slate-800">Faculty Directory ({filteredFaculty.length})</h3>
                      <p className="text-xs text-slate-500">Only Admin and Staff can register faculty members and assign login passwords.</p>
                    </div>
                    {permissions.canManageFaculty && (
                      <button type="button" onClick={() => setModalType('addFaculty')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-2 shadow-md shadow-indigo-600/30 transition-all">
                        <Icon name="plus" className="w-4 h-4" />
                        <span>Register New Faculty</span>
                      </button>
                    )}
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-4">Name / ID</th>
                          {permissions.canManageFaculty && <th className="p-4">Login Password</th>}
                          <th className="p-4">Designation</th>
                          <th className="p-4">Department</th>
                          <th className="p-4">Course Coordinator</th>
                          <th className="p-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {filteredFaculty.map(f => (
                          <tr key={f.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="p-4">
                              <span className="font-bold text-slate-800 block">{f.name}</span>
                              <span className="text-slate-400 text-[11px]">{f.id} • {f.email}</span>
                            </td>
                            {permissions.canManageFaculty && (
                              <td className="p-4 font-mono text-[11px] text-rose-700 bg-rose-50/40">{f.password}</td>
                            )}
                            <td className="p-4 text-slate-600 font-semibold">{f.designation}</td>
                            <td className="p-4 text-slate-600">{f.department}</td>
                            <td className="p-4 text-slate-600">{f.courseCoordinator}</td>
                            <td className="p-4 text-right space-x-2">
                              {permissions.canManageFaculty ? (
                                <>
                                  <button type="button" onClick={() => { setEditingFaculty(f); setModalType('editFaculty'); }} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="edit" className="w-3.5 h-3.5" />
                                    <span>Edit</span>
                                  </button>
                                  <button type="button" onClick={() => handleDeleteFaculty(f.id)} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                    <span>Delete</span>
                                  </button>
                                </>
                              ) : (
                                <span className="text-slate-400 text-[11px] italic">View Only</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- COURSES TAB --- */}
              {activeTab === 'courses' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-sm font-bold text-slate-800">Course Curriculum ({filteredCourses.length})</h3>
                      <p className="text-xs text-slate-500">Active university courses, credits, and faculty assignments.</p>
                    </div>
                    {permissions.canManageCourses && (
                      <button type="button" onClick={() => setModalType('addCourse')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-2 shadow-md shadow-indigo-600/30 transition-all">
                        <Icon name="plus" className="w-4 h-4" />
                        <span>Add Course</span>
                      </button>
                    )}
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-4">Code & Title</th>
                          <th className="p-4">Faculty Lead</th>
                          <th className="p-4">Credits</th>
                          <th className="p-4">Enrolled Students</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {filteredCourses.map(c => (
                          <tr key={c.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="p-4">
                              <span className="font-bold text-slate-800 block">{c.title}</span>
                              <span className="text-slate-400 text-[11px]">{c.id}</span>
                            </td>
                            <td className="p-4 text-slate-600">{c.faculty}</td>
                            <td className="p-4 text-slate-600 font-semibold">{c.credits} Credits</td>
                            <td className="p-4 text-slate-600">{c.enrolled} Students</td>
                            <td className="p-4">
                              <span className="px-2 py-0.5 rounded font-semibold bg-blue-50 text-blue-700 border border-blue-200 text-[10px]">{c.status}</span>
                            </td>
                            <td className="p-4 text-right space-x-2">
                              {permissions.canManageCourses ? (
                                <>
                                  <button type="button" onClick={() => { setEditingCourse(c); setModalType('editCourse'); }} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="edit" className="w-3.5 h-3.5" />
                                    <span>Edit</span>
                                  </button>
                                  <button type="button" onClick={() => handleDeleteCourse(c.id)} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                    <span>Delete</span>
                                  </button>
                                </>
                              ) : (
                                <span className="text-slate-400 text-[11px] italic">View Only</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- RESOURCES TAB --- */}
              {activeTab === 'resources' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-sm font-bold text-slate-800">Facilities & Resources ({filteredResources.length})</h3>
                      <p className="text-xs text-slate-500">Auditoriums, labs, and equipment availability.</p>
                    </div>
                    {permissions.canManageResources && (
                      <button type="button" onClick={() => setModalType('addResource')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-2 shadow-md shadow-indigo-600/30 transition-all">
                        <Icon name="plus" className="w-4 h-4" />
                        <span>Add Resource</span>
                      </button>
                    )}
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-4">Facility Name / ID</th>
                          <th className="p-4">Category</th>
                          <th className="p-4">Capacity</th>
                          <th className="p-4">Specifications</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {filteredResources.map(r => (
                          <tr key={r.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="p-4">
                              <span className="font-bold text-slate-800 block">{r.name}</span>
                              <span className="text-slate-400 text-[11px]">{r.id}</span>
                            </td>
                            <td className="p-4 text-slate-600">{r.category}</td>
                            <td className="p-4 text-slate-600 font-semibold">{r.capacity} Seats</td>
                            <td className="p-4 text-slate-500 text-[11px]">{r.specs}</td>
                            <td className="p-4">
                              <span className={`px-2 py-0.5 rounded font-semibold text-[10px] border ${
                                r.status === 'Available' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                r.status === 'Occupied' ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                              }`}>{r.status}</span>
                            </td>
                            <td className="p-4 text-right space-x-2">
                              {permissions.canManageResources ? (
                                <>
                                  <button type="button" onClick={() => { setEditingResource(r); setModalType('editResource'); }} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="edit" className="w-3.5 h-3.5" />
                                    <span>Edit</span>
                                  </button>
                                  <button type="button" onClick={() => handleDeleteResource(r.id)} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                    <span>Delete</span>
                                  </button>
                                </>
                              ) : (
                                <button type="button" onClick={() => setActiveTab('bookings')} className="px-2.5 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded font-semibold text-[11px]">Book</button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- ACTIVITIES TAB --- */}
              {activeTab === 'activities' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-sm font-bold text-slate-800">Campus Events & Activities ({filteredActivities.length})</h3>
                      <p className="text-xs text-slate-500">Scheduled campus hackathons, lectures, and competitions.</p>
                    </div>
                    {permissions.canManageActivities && (
                      <button type="button" onClick={() => setModalType('addActivity')} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-2 shadow-md shadow-indigo-600/30 transition-all">
                        <Icon name="plus" className="w-4 h-4" />
                        <span>Add Event</span>
                      </button>
                    )}
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-4">Event Name</th>
                          <th className="p-4">Date & Time</th>
                          <th className="p-4">Venue</th>
                          <th className="p-4">Organizer</th>
                          <th className="p-4">Status</th>
                          <th className="p-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {filteredActivities.map(a => (
                          <tr key={a.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="p-4">
                              <span className="font-bold text-slate-800 block">{a.name}</span>
                              <span className="text-slate-400 text-[11px]">{a.id}</span>
                            </td>
                            <td className="p-4 text-slate-600">{a.date} at {a.time}</td>
                            <td className="p-4 text-slate-600 font-semibold">{a.venue}</td>
                            <td className="p-4 text-slate-600">{a.organizer}</td>
                            <td className="p-4">
                              <span className="px-2 py-0.5 rounded font-semibold bg-purple-50 text-purple-700 border border-purple-200 text-[10px]">{a.status}</span>
                            </td>
                            <td className="p-4 text-right space-x-2">
                              {permissions.canManageActivities ? (
                                <>
                                  <button type="button" onClick={() => { setEditingActivity(a); setModalType('editActivity'); }} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="edit" className="w-3.5 h-3.5" />
                                    <span>Edit</span>
                                  </button>
                                  <button type="button" onClick={() => handleDeleteActivity(a.id)} className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 rounded font-semibold text-[11px] transition-colors">
                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                    <span>Delete</span>
                                  </button>
                                </>
                              ) : (
                                <span className="text-slate-400 text-[11px] italic">View Only</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- BOOKINGS TAB --- */}
              {activeTab === 'bookings' && (
                <div className="max-w-xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm animate-fade-in">
                  <div className="mb-6">
                    <h3 className="text-sm font-bold text-slate-800">Resource Reservation Engine</h3>
                    <p className="text-xs text-slate-500">Book auditoriums, labs, or equipment with real-time conflict checking.</p>
                  </div>

                  {bookingStatusMsg && (
                    <div className={`mb-4 p-3 rounded-lg text-xs font-semibold border ${
                      bookingStatusMsg.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
                    }`}>
                      {bookingStatusMsg.text}
                    </div>
                  )}

                  <form onSubmit={handleSimulateBooking} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Select Facility / Resource</label>
                      <select
                        value={bookingDetails.resourceId}
                        onChange={(e) => setBookingDetails({ ...bookingDetails, resourceId: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500"
                      >
                        {resources.map(r => (
                          <option key={r.id} value={r.id}>
                            {r.name} — {r.category} ({r.status})
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Reserved By (Active User)</label>
                      <input
                        type="text"
                        value={bookingDetails.user || currentUser.name}
                        onChange={(e) => setBookingDetails({ ...bookingDetails, user: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-700 font-semibold"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Reservation Date</label>
                        <input
                          type="date"
                          value={bookingDetails.date}
                          onChange={(e) => setBookingDetails({ ...bookingDetails, date: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Time Slot</label>
                        <select
                          value={bookingDetails.timeSlot}
                          onChange={(e) => setBookingDetails({ ...bookingDetails, timeSlot: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800"
                        >
                          <option>09:00 AM - 11:00 AM</option>
                          <option>11:30 AM - 01:30 PM</option>
                          <option>02:00 PM - 04:00 PM</option>
                          <option>04:30 PM - 06:30 PM</option>
                        </select>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/30 transition-all"
                    >
                      Confirm Facility Reservation
                    </button>
                  </form>
                </div>
              )}

            </div>
          </main>

          {/* --- MODALS (ADD & EDIT) --- */}
          {modalType && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl animate-fade-in border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-800 text-sm capitalize">
                    {modalType.replace(/([A-Z])/g, ' $1')}
                  </h3>
                  <button type="button" onClick={() => setModalType(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                {/* ADD STUDENT MODAL (Admin & Staff Only) */}
                {modalType === 'addStudent' && permissions.canManageStudents && (
                  <form onSubmit={handleAddStudent} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Student Full Name (Login Username)</label>
                      <input type="text" placeholder="e.g. Vivek Kumar" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email Address</label>
                        <input type="email" placeholder="vivek@campus.edu" value={newStudent.email} onChange={e => setNewStudent({...newStudent, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Assign Login Password</label>
                        <input type="text" placeholder="Set password" value={newStudent.password} onChange={e => setNewStudent({...newStudent, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Phone</label>
                      <input type="text" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Department</label>
                        <input type="text" value={newStudent.department} onChange={e => setNewStudent({...newStudent, department: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Year</label>
                        <select value={newStudent.year} onChange={e => setNewStudent({...newStudent, year: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                          <option>1st Year</option>
                          <option>2nd Year</option>
                          <option>3rd Year</option>
                          <option>4th Year</option>
                        </select>
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Register Student & Password</button>
                  </form>
                )}

                {/* EDIT STUDENT MODAL (Admin & Staff Only) */}
                {modalType === 'editStudent' && editingStudent && permissions.canManageStudents && (
                  <form onSubmit={handleUpdateStudent} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Student Full Name</label>
                      <input type="text" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email Address</label>
                        <input type="email" value={editingStudent.email} onChange={e => setEditingStudent({...editingStudent, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Login Password</label>
                        <input type="text" value={editingStudent.password || ''} onChange={e => setEditingStudent({...editingStudent, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Phone</label>
                      <input type="text" value={editingStudent.phone} onChange={e => setEditingStudent({...editingStudent, phone: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Update Student Record</button>
                  </form>
                )}

                {/* ADD FACULTY MODAL (Admin & Staff Only) */}
                {modalType === 'addFaculty' && permissions.canManageFaculty && (
                  <form onSubmit={handleAddFaculty} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Faculty Full Name (Login Username)</label>
                      <input type="text" placeholder="e.g. Prof. Anil Rao" value={newFaculty.name} onChange={e => setNewFaculty({...newFaculty, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email</label>
                        <input type="email" placeholder="anil@campus.edu" value={newFaculty.email} onChange={e => setNewFaculty({...newFaculty, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Assign Login Password</label>
                        <input type="text" placeholder="Set password" value={newFaculty.password} onChange={e => setNewFaculty({...newFaculty, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Department</label>
                        <input type="text" value={newFaculty.department} onChange={e => setNewFaculty({...newFaculty, department: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Designation</label>
                        <input type="text" value={newFaculty.designation} onChange={e => setNewFaculty({...newFaculty, designation: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Course Coordinator</label>
                      <input type="text" placeholder="e.g. CS301 - Data Structures" value={newFaculty.courseCoordinator} onChange={e => setNewFaculty({...newFaculty, courseCoordinator: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Register Faculty & Password</button>
                  </form>
                )}

                {/* EDIT FACULTY MODAL (Admin & Staff Only) */}
                {modalType === 'editFaculty' && editingFaculty && permissions.canManageFaculty && (
                  <form onSubmit={handleUpdateFaculty} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Faculty Name</label>
                      <input type="text" value={editingFaculty.name} onChange={e => setEditingFaculty({...editingFaculty, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email</label>
                        <input type="email" value={editingFaculty.email} onChange={e => setEditingFaculty({...editingFaculty, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Login Password</label>
                        <input type="text" value={editingFaculty.password || ''} onChange={e => setEditingFaculty({...editingFaculty, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Designation</label>
                      <input type="text" value={editingFaculty.designation} onChange={e => setEditingFaculty({...editingFaculty, designation: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Course Coordinator</label>
                      <input type="text" value={editingFaculty.courseCoordinator || ''} onChange={e => setEditingFaculty({...editingFaculty, courseCoordinator: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Update Faculty Record</button>
                  </form>
                )}

                {/* ADD COURSE MODAL */}
                {modalType === 'addCourse' && (
                  <form onSubmit={handleAddCourse} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Course Code</label>
                      <input type="text" placeholder="e.g. CS401" value={newCourse.id} onChange={e => setNewCourse({...newCourse, id: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Course Title</label>
                      <input type="text" value={newCourse.title} onChange={e => setNewCourse({...newCourse, title: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Faculty Lead</label>
                      <input type="text" value={newCourse.faculty} onChange={e => setNewCourse({...newCourse, faculty: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Credits</label>
                        <input type="number" value={newCourse.credits} onChange={e => setNewCourse({...newCourse, credits: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Enrolled</label>
                        <input type="number" value={newCourse.enrolled} onChange={e => setNewCourse({...newCourse, enrolled: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Save Course</button>
                  </form>
                )}

                {/* EDIT COURSE MODAL */}
                {modalType === 'editCourse' && editingCourse && (
                  <form onSubmit={handleUpdateCourse} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Course Title</label>
                      <input type="text" value={editingCourse.title} onChange={e => setEditingCourse({...editingCourse, title: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Faculty Lead</label>
                      <input type="text" value={editingCourse.faculty} onChange={e => setEditingCourse({...editingCourse, faculty: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Update Course</button>
                  </form>
                )}

                {/* ADD RESOURCE MODAL */}
                {modalType === 'addResource' && (
                  <form onSubmit={handleAddResource} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Facility Name</label>
                      <input type="text" value={newResource.name} onChange={e => setNewResource({...newResource, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Category</label>
                        <input type="text" value={newResource.category} onChange={e => setNewResource({...newResource, category: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Capacity</label>
                        <input type="number" value={newResource.capacity} onChange={e => setNewResource({...newResource, capacity: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Specifications</label>
                      <input type="text" value={newResource.specs} onChange={e => setNewResource({...newResource, specs: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Save Resource</button>
                  </form>
                )}

                {/* EDIT RESOURCE MODAL */}
                {modalType === 'editResource' && editingResource && (
                  <form onSubmit={handleUpdateResource} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Facility Name</label>
                      <input type="text" value={editingResource.name} onChange={e => setEditingResource({...editingResource, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Category</label>
                        <input type="text" value={editingResource.category} onChange={e => setEditingResource({...editingResource, category: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Status</label>
                        <select value={editingResource.status} onChange={e => setEditingResource({...editingResource, status: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                          <option>Available</option>
                          <option>Occupied</option>
                          <option>Maintenance</option>
                        </select>
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Update Resource</button>
                  </form>
                )}

                {/* ADD ACTIVITY MODAL */}
                {modalType === 'addActivity' && (
                  <form onSubmit={handleAddActivity} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Event Name</label>
                      <input type="text" value={newActivity.name} onChange={e => setNewActivity({...newActivity, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Date</label>
                        <input type="date" value={newActivity.date} onChange={e => setNewActivity({...newActivity, date: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Venue</label>
                        <input type="text" value={newActivity.venue} onChange={e => setNewActivity({...newActivity, venue: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Organizer</label>
                      <input type="text" value={newActivity.organizer} onChange={e => setNewActivity({...newActivity, organizer: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Save Event</button>
                  </form>
                )}

                {/* EDIT ACTIVITY MODAL */}
                {modalType === 'editActivity' && editingActivity && (
                  <form onSubmit={handleUpdateActivity} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Event Name</label>
                      <input type="text" value={editingActivity.name} onChange={e => setEditingActivity({...editingActivity, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Venue</label>
                      <input type="text" value={editingActivity.venue} onChange={e => setEditingActivity({...editingActivity, venue: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md mt-2">Update Event</button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
